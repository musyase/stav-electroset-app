plugins {
    id 'com.android.application'
}

import java.util.Properties

// ---------- local.properties (SUPABASE_URL / SUPABASE_ANON_KEY) ----------
def localProps = new Properties()
def localPropsFile = rootProject.file("local.properties")
if (localPropsFile.exists()) {
    localPropsFile.withInputStream { stream -> localProps.load(stream) }
}

def supabaseUrl = (localProps.getProperty("SUPABASE_URL") ?: "").trim()
def supabaseAnonKey = (localProps.getProperty("SUPABASE_ANON_KEY") ?: "").trim()

if (!supabaseUrl || !supabaseAnonKey) {
    throw new GradleException("SUPABASE_URL / SUPABASE_ANON_KEY не заданы в local.properties")
}

android {
    namespace 'com.yourapp.stavelectroset'
    compileSdk 35

    defaultConfig {
        applicationId "com.yourapp.stavelectroset"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Доступно в коде как BuildConfig.SUPABASE_URL / BuildConfig.SUPABASE_ANON_KEY
        buildConfigField "String", "SUPABASE_URL", "\"${supabaseUrl}\""
        buildConfigField "String", "SUPABASE_ANON_KEY", "\"${supabaseAnonKey}\""
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        debug {
            minifyEnabled false
            shrinkResources false
        }
        release {
            minifyEnabled true
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    // UI
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'

    // Lifecycle
    implementation 'androidx.lifecycle:lifecycle-livedata:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.10.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.10.0'

    // Security (для токенов)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Room
    def roomVersion = "2.8.4"
    implementation "androidx.room:room-runtime:$roomVersion"
    annotationProcessor "androidx.room:room-compiler:$roomVersion"

    // Network
    implementation platform('com.squareup.okhttp3:okhttp-bom:5.3.2')
    implementation 'com.squareup.okhttp3:okhttp'
    implementation 'com.squareup.okhttp3:logging-interceptor'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    implementation 'org.jsoup:jsoup:1.17.2'

    // Images
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"

    // Maps & geo
    implementation "com.yandex.android:maps.mobile:4.25.0-full"
    implementation "com.google.android.gms:play-services-location:21.3.0"

    // Parsing docs
    implementation "org.apache.poi:poi-ooxml:5.2.5"
}
