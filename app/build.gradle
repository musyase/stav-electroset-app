plugins { id 'com.android.application' }

android {
    namespace 'com.yourapp.stavelectroset'
    compileSdk 35

    defaultConfig {
        applicationId "com.yourapp.stavelectroset"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // переменные окружения (потом можно сделать productFlavors)
    buildFeatures { buildConfig true }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.webkit:webkit:1.14.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'

    // Lifecycle (LiveData)
    implementation 'androidx.lifecycle:lifecycle-livedata:2.9.4'

    // Room
    implementation 'androidx.room:room-runtime:2.8.3'
    annotationProcessor 'androidx.room:room-compiler:2.8.3'

    // Сеть + парсинг
    implementation 'com.squareup.okhttp3:okhttp:5.3.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.3.0'   // <— ВАЖНО
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'org.jsoup:jsoup:1.17.2'

    // Картинки
    implementation "com.github.bumptech.glide:glide:4.16.0"
    annotationProcessor "com.github.bumptech.glide:compiler:4.16.0"
    implementation 'com.google.android.material:material:1.13.0'

    // Карты и гео
    implementation "com.yandex.android:maps.mobile:4.25.0-full"
    implementation "com.google.android.material:material:1.13.0"
    implementation "com.google.android.gms:play-services-location:21.3.0"
}
